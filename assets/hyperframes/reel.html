<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Anton";
        src: url("fonts/Anton-Regular.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        --accent: #ffd400;
        --primary: #ffffff;
        --fs: 90px;
      }
      #base {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        transform-origin: 50% 42%;
      }
      .cap {
        position: absolute;
        left: 50px;
        right: 50px;
        text-align: center;
        font-family: "Anton", Impact, sans-serif;
        font-size: var(--fs);
        line-height: 1.08;
        color: var(--primary);
        opacity: 0;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.45), 0 0 22px rgba(0, 0, 0, 0.55);
        -webkit-text-stroke: 3px rgba(0, 0, 0, 0.85);
        paint-order: stroke fill;
      }
      .cap .w {
        display: inline-block;
        margin: 0 0.17em;
      }
      .hook {
        position: absolute;
        top: 230px;
        left: 70px;
        right: 70px;
        text-align: center;
        opacity: 0;
      }
      .hook span {
        display: inline-block;
        font-family: "Anton", Impact, sans-serif;
        font-size: calc(var(--fs) * 1.02);
        line-height: 1.05;
        color: #111;
        background: var(--accent);
        padding: 18px 30px 22px;
        border-radius: 26px;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4);
      }
      .emoji {
        position: absolute;
        font-size: 170px;
        line-height: 1;
        opacity: 0;
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
        font-family: "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      }
      .end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.78));
        opacity: 0;
      }
      .end .punch {
        font-family: "Anton", Impact, sans-serif;
        font-size: calc(var(--fs) * 1.32);
        line-height: 1.04;
        color: var(--accent);
        text-align: center;
        padding: 0 70px;
        -webkit-text-stroke: 4px rgba(0, 0, 0, 0.8);
        paint-order: stroke fill;
      }
      .end .cta {
        margin-top: 34px;
        font-family: system-ui, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 46px;
        color: #111;
        background: #fff;
        padding: 16px 34px;
        border-radius: 999px;
      }
      .bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 14px;
        width: 1080px;
        background: var(--accent);
        transform-origin: 0 50%;
        transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-width="1080" data-height="1920" data-start="0" data-duration="__DURATION__">
      <video id="base" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0" src="base.mp4" muted playsinline></video>
      <div id="layer"></div>
      <script src="gsap.min.js"></script>
      <script>
        // Data is written by the server from a validated storyboard; this file never contains model-written code.
        const D = /*__DATA__*/ null;
        const root = document.getElementById("root");
        const layer = document.getElementById("layer");
        root.style.setProperty("--accent", D.style.accent);
        root.style.setProperty("--primary", D.style.primary);
        root.style.setProperty("--fs", D.style.fs + "px");
        const tl = gsap.timeline({ paused: true });
        const el = (cls, html) => {
          const n = document.createElement("div");
          n.className = cls;
          if (html !== undefined) n.textContent = html;
          layer.appendChild(n);
          return n;
        };

        // Kinetic captions: one line at a time, active word lit and popped.
        for (const line of D.lines) {
          const box = el("cap");
          box.style.top = D.caption_y + "px";
          const spans = line.words.map((w) => {
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = w.t;
            if (w.hl) s.style.color = D.style.accent;
            box.appendChild(s);
            return s;
          });
          tl.set(box, { opacity: 1 }, line.start);
          if (D.style.pop) tl.fromTo(box, { scale: 0.86, y: 26 }, { scale: 1, y: 0, duration: 0.14, ease: "back.out(3)" }, line.start);
          tl.set(box, { opacity: 0 }, line.end);
          line.words.forEach((w, i) => {
            const next = i + 1 < line.words.length ? line.words[i + 1].s : line.end;
            tl.set(spans[i], { color: D.style.accent, scale: D.style.pop ? 1.12 : 1 }, w.s);
            tl.set(spans[i], { color: w.hl ? D.style.accent : D.style.primary, scale: 1 }, next);
          });
        }

        // Zoom punch-ins on the words that carry the message.
        for (const t of D.zooms) {
          tl.to("#base", { scale: 1.12, duration: 0.14, ease: "power2.out" }, t);
          tl.to("#base", { scale: 1, duration: 0.45, ease: "power2.inOut" }, t + 0.5);
        }

        // Emoji pops, alternating sides.
        D.emojis.forEach((m, i) => {
          const n = el("emoji", m.e);
          n.style.top = 520 + (i % 3) * 120 + "px";
          n.style.left = i % 2 ? "760px" : "120px";
          tl.fromTo(n, { opacity: 0, scale: 0.2, rotation: i % 2 ? 25 : -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(2.6)" }, m.t);
          tl.to(n, { opacity: 0, y: -80, duration: 0.3 }, m.t + 1.1);
        });

        if (D.hook) {
          const h = el("hook");
          const s = document.createElement("span");
          s.textContent = D.hook;
          h.appendChild(s);
          tl.fromTo(h, { opacity: 0, y: -70, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.08);
          tl.to(h, { opacity: 0, y: -50, duration: 0.25 }, Math.min(2.5, D.duration - 0.3));
        }

        if (D.punch) {
          const end = el("end");
          const p = document.createElement("div");
          p.className = "punch";
          p.textContent = D.punch;
          end.appendChild(p);
          if (D.cta) {
            const c = document.createElement("div");
            c.className = "cta";
            c.textContent = D.cta;
            end.appendChild(c);
          }
          tl.fromTo(end, { opacity: 0 }, { opacity: 1, duration: 0.3 }, D.punch_start);
          tl.fromTo(p, { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, D.punch_start);
        }

        if (D.style.progress) {
          const bar = el("bar");
          tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: D.duration, ease: "none" }, 0);
        }

        tl.set({}, {}, D.duration); // pin the timeline length
        window.__timelines = window.__timelines || {};
        window.__timelines.reel = tl;
      </script>
    </div>
  </body>
</html>
