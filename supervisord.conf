[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
directory=/app/backend
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --workers 1 --proxy-headers --forwarded-allow-ips=*
autorestart=true
startretries=1000
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
directory=/app/wa-gateway
command=node --import tsx src/index.ts
environment=API_URL="http://127.0.0.1:%(ENV_PORT)s"
autorestart=true
startretries=1000
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
